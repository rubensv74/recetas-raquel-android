name: Room schema sync

on:
  push:
    branches:
      - program/ingredient-library-food-safety
    paths:
      - .github/workflows/room-schema-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: program/ingredient-library-food-safety

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Install Android 36.1 platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1"

      - name: Generate and commit Room v6 schema
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug
          schema="app/schemas/com.rmm.recetasraquel.data.local.RecipeDatabase/6.json"
          test -f "$schema"
          git add "$schema"
          if git diff --cached --quiet; then
            echo "Room v6 schema already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "db: commit Room v6 schema"
          git push origin HEAD:program/ingredient-library-food-safety
