name: RC1 Exact Candidate Validation

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/rc1-exact-validation.yml"

permissions:
  contents: read

jobs:
  rc1-exact:
    name: RC1 — release and full Android 36 gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Install Android 36.1 platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1"

      - name: Assemble release candidate
        run: ./gradlew --no-daemon assembleRelease

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run full instrumented suite on Android 36
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Guard Room schemas after exact-candidate validation
        shell: bash
        run: |
          set -euo pipefail
          schema_dir="app/schemas/com.rmm.recetasraquel.data.local.RecipeDatabase"
          test -d "$schema_dir"
          if [[ -n "$(git status --porcelain -- "$schema_dir")" ]]; then
            echo "Room schema files differ from the committed contract."
            git status --short -- "$schema_dir"
            exit 1
          fi
