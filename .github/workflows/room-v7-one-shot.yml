name: Room v7 one-shot gate

on:
  push:
    branches:
      - program/culinary-catalog-v13

permissions:
  contents: write

concurrency:
  group: room-v7-one-shot
  cancel-in-progress: true

jobs:
  validate-and-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: program/culinary-catalog-v13

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Install Android 36.1 platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1"

      - name: Compile, unit test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Verify Room v7 schema
        shell: bash
        run: |
          set -euo pipefail
          test -f app/schemas/com.rmm.recetasraquel.data.local.RecipeDatabase/7.json
          git status --short -- app/schemas/com.rmm.recetasraquel.data.local.RecipeDatabase

      - name: Commit generated Room schema and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/room-v7-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas/com.rmm.recetasraquel.data.local.RecipeDatabase/7.json .github/workflows/room-v7-one-shot.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 1
          fi
          git commit -m "chore: materialize Room v7 schema [schema-v7]"
          git push origin HEAD:program/culinary-catalog-v13
