name: V13 catalog relation generation

on:
  push:
    branches:
      - program/culinary-catalog-v13
    paths:
      - .github/workflows/v13-catalog-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: program/culinary-catalog-v13

      - name: Generate regulated relations and update manifest
        run: python3 tools/catalog/generate_v13_regulated_relations.py

      - name: Commit generated catalog assets
        shell: bash
        run: |
          set -euo pipefail
          git add \
            app/src/main/assets/ingredient-catalog/v13/safety-relations.json \
            app/src/main/assets/ingredient-catalog/v13/ingredient-relations-culinary-regulated-v13.json \
            app/src/main/assets/ingredient-catalog/v13/manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "catalog: generate v13 regulated evidence and lineage"
          git push origin HEAD:program/culinary-catalog-v13
