name: V13 compound connected one-shot gate

on:
  push:
    branches:
      - program/culinary-catalog-v13

permissions:
  contents: write

concurrency:
  group: v13-compound-connected-one-shot
  cancel-in-progress: true

jobs:
  connected-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: program/culinary-catalog-v13

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Compile instrumentation tests
        run: ./gradlew --no-daemon compileDebugAndroidTestKotlin

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@f8e64cdbfe5de313c80bad891ab6ef0af8b7a4c8
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Room schema guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/schemas/com.rmm.recetasraquel.data.local.RecipeDatabase
          test -f app/schemas/com.rmm.recetasraquel.data.local.RecipeDatabase/7.json

      - name: Remove one-shot workflow after green gate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v13-compound-connected-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v13-compound-connected-one-shot.yml
          git commit -m "chore: close v13 compound connected gate [connected-v13]"
          git push origin HEAD:program/culinary-catalog-v13
