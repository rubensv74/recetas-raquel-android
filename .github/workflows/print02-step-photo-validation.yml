name: PRINT-02 Step Photo Validation

on:
  push:
    branches:
      - fix/print-step-photos

permissions:
  contents: read

concurrency:
  group: print02-step-photos
  cancel-in-progress: true

jobs:
  validate:
    name: PRINT-02 — build and test gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Install Android 36.1 platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1"

      - name: Validate step-photo printing
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug compileDebugAndroidTestKotlin
