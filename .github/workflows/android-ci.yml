name: Android CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci

jobs:
  pr-gate:
    name: PR gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Detect Android-impacting changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Changed files:"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(app/|gradle/|gradlew$|gradlew\.bat$|gradle\.properties$|[^/]+\.gradle\.kts$|\.github/workflows/android-ci\.yml$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "Android-impacting change detected; running build, unit tests, lint and Room guard."
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "No Android-impacting files changed; expensive Android validation is not required."
          fi

      - name: Make Gradle wrapper executable
        if: steps.changes.outputs.android == 'true'
        run: chmod +x gradlew

      - name: Set up JDK 21
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Install Android 36.1 platform
        if: steps.changes.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1"

      - name: Validate debug build, unit tests and lint
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Guard Room schemas
        if: steps.changes.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          schema_dir="app/schemas/com.rmm.recetasraquel.data.local.RecipeDatabase"

          if [[ ! -d "$schema_dir" ]]; then
            echo "Room schema directory is missing."
            exit 1
          fi

          echo "Room schemas found:"
          find "$schema_dir" -maxdepth 1 -type f -name '*.json' -printf '%f\n' | sort

          if [[ -n "$(git status --porcelain -- "$schema_dir")" ]]; then
            echo "Room schema files differ from the committed contract. Commit the generated migration schemas."
            git status --short -- "$schema_dir"
            exit 1
          fi

      - name: Confirm lightweight gate
        if: steps.changes.outputs.android != 'true'
        run: echo "PR gate passed without Android build because only non-impacting files changed."

  full-validation:
    name: Manual gate — full Android validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Install Android 36.1 platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1"

      - name: Validate debug and release builds, unit tests and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleRelease

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run connected Android tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Guard Room schemas after full validation
        shell: bash
        run: |
          set -euo pipefail
          schema_dir="app/schemas/com.rmm.recetasraquel.data.local.RecipeDatabase"

          if [[ ! -d "$schema_dir" ]]; then
            echo "Room schema directory is missing."
            exit 1
          fi

          if [[ -n "$(git status --porcelain -- "$schema_dir")" ]]; then
            echo "Room schema files differ from the committed contract after full validation."
            git status --short -- "$schema_dir"
            exit 1
          fi
